[project]
name = "xiaogpt"
description = "Play ChatGPT or other LLM with xiaomi AI speaker"
readme = "README.md"
authors = [
    {name = "yihong0618", email = "zouzou0208@gmail.com"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "miservice==3.0.1",
    "republic>=0.6.1",
    "httpx2[socks]>=2.16.0",
    "aiohttp>=3.14.4",
    "requests>=2.32.3",
    "rich>=15.0.0",
    "tetos>=0.4.3",
    "pyyaml>=6.0.3",
    "lingua-language-detector>=2.2.0",
]
license = {text = "MIT"}
dynamic = ["version", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/yihong0618/xiaogpt"

[project.scripts]
xiaogpt = "xiaogpt.cli:main"

[dependency-groups]
dev = ["black>=26.10.0"]

[tool.pdm]
plugins = ["pdm-autoexport"]

[tool.pdm.version]
source = "scm"

[tool.pdm.build]
includes = ["xiaogpt/"]
source-includes = ["pdm.lock"]
locked = true

[[tool.pdm.autoexport]]
filename = "requirements.txt"
without-hashes = true

[build-system]
requires = ["pdm-backend>=2.5.0", "pdm-build-locked>=0.3.8"]
build-backend = "pdm.backend"
