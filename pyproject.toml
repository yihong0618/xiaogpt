[project]
name = "xiaogpt"
description = "Play ChatGPT or other LLM with xiaomi AI speaker"
readme = "README.md"
authors = [
    {name = "yihong0618", email = "zouzou0208@gmail.com"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "miservice==3.0.1",
    "openai>=3.26.0",
    "aiohttp>=3.14.4",
    "rich>=15.0.0",
    "zhipuai>=2.1.5.20250825",
    "httpx[socks]>=0.28.1",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "beautifulsoup4>=4.15.0",
    "google-search-results>=2.4.2",
    "google-genai>=2.28.0",
    "numexpr>=2.14.2",
    "dashscope>=1.27.7",
    "tetos>=0.4.3",
    "groq>=1.7.0",
    "pyyaml>=6.0.3",
    "langchain-community>=0.4.2",
    "lingua-language-detector>=2.2.0",
    "volcengine-python-sdk[ark]>=5.0.50",
]
license = {text = "MIT"}
dynamic = ["version", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/yihong0618/xiaogpt"

[project.scripts]
xiaogpt = "xiaogpt.cli:main"

[dependency-groups]
dev = ["black>=26.10.0"]

[tool.pdm]
plugins = ["pdm-autoexport"]

[tool.pdm.version]
source = "scm"

[tool.pdm.build]
includes = ["xiaogpt/"]
source-includes = ["pdm.lock"]
locked = true

[[tool.pdm.autoexport]]
filename = "requirements.txt"
without-hashes = true

[build-system]
requires = ["pdm-backend>=2.5.0", "pdm-build-locked>=0.3.8"]
build-backend = "pdm.backend"
